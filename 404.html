<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SIMSIMNAONAO</title>
    <script type="text/javascript">
      // Truque para lidar com Single Page Apps no GitHub Pages
      var pathSegment = window.location.pathname;
      window.location.replace(
        window.location.protocol + "//" + window.location.hostname + (window.location.port ? ":" + window.location.port : "") + "/?path=" + pathSegment.split('/').pop()
      );
    </script>
  </head>

</html>
